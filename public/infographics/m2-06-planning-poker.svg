<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 1166" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
<title id="title">Story Points и Planning Poker</title><desc id="desc">Planning Poker помогает совместно оценить относительную сложность и обнаружить неопред…</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fcff"/><stop offset="1" stop-color="#fffaff"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#174da1" flood-opacity=".09"/></filter>
<style>
.title{font:800 43px Arial,sans-serif;fill:#082d6c}.tag{font:800 15px Arial,sans-serif;letter-spacing:2px;fill:#2456a6}
.subtitle{font:600 18px Arial,sans-serif;fill:#315477}.flow{font:800 17px Arial,sans-serif;fill:#173e7b}
.eyebrow{font:800 14px Arial,sans-serif;letter-spacing:1px;fill:#315b9b}.heading{font:800 20px Arial,sans-serif;fill:#123d83}
.body{font:600 14px Arial,sans-serif;fill:#315477}.number{font:800 16px Arial,sans-serif;fill:#fff}
.footerTitle{font:800 17px Arial,sans-serif;fill:#174a91}.footer{font:600 16px Arial,sans-serif;fill:#315477}
.brand{font:700 12px Arial,sans-serif;letter-spacing:.2px;fill:#8aa5c5}
</style></defs>
<rect width="1065" height="1166" fill="url(#paper)"/>
<circle cx="1002" cy="88" r="94" fill="#eaf3ff"/><circle cx="1002" cy="88" r="58" fill="#d8e9ff"/>
<text x="34" y="76" class="tag">ОЦЕНКА · КОМАНДНОЕ ОБСУЖДЕНИЕ · VELOCITY</text><text x="34" y="143" class="title">Story Points и Planning Poker</text><text x="34" y="185" class="subtitle">Planning Poker помогает совместно оценить относительную сложность и обнаружить неопред…</text>
<rect x="32" y="212" width="1000" height="94" rx="22" fill="#fff" stroke="#c8ddf4" stroke-width="2"/>
<text x="54" y="237" class="eyebrow">КЛЮЧЕВАЯ СХЕМА</text><rect x="32" y="244" width="190.4" height="62" rx="16" fill="#e8f3ff" stroke="#9fc7f2" stroke-width="2"/><text x="127.2" y="277" text-anchor="middle" class="flow">Задача</text><rect x="234.4" y="244" width="190.4" height="62" rx="16" fill="#f1edff" stroke="#c4b5fd" stroke-width="2"/><text x="329.6" y="277" text-anchor="middle" class="flow">Вопросы</text><rect x="436.8" y="244" width="190.4" height="62" rx="16" fill="#e8faf3" stroke="#9cdec6" stroke-width="2"/><text x="532" y="277" text-anchor="middle" class="flow">Голосование</text><rect x="639.2" y="244" width="190.4" height="62" rx="16" fill="#fff5df" stroke="#f0d28a" stroke-width="2"/><text x="734.4000000000001" y="277" text-anchor="middle" class="flow">Обсуждение</text><rect x="841.6" y="244" width="190.4" height="62" rx="16" fill="#fff0f3" stroke="#efb7c6" stroke-width="2"/><text x="936.8000000000001" y="277" text-anchor="middle" class="flow">Оценка</text>

<rect x="32" y="330" width="491" height="184" rx="22" fill="#f2f8ff" stroke="#b9d7f5" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="368" r="19" fill="#315fae"/><text x="70" y="374" text-anchor="middle" class="number">1</text><text x="102" y="373" class="eyebrow">STORY POINTS</text><text x="58" y="412" class="heading">Относительная оценка</text><text x="58" y="440" class="body">Учитывают объём работы, техническую сложность и риски. Это</text><text x="58" y="461" class="body">не часы и не дни.</text><rect x="541" y="330" width="491" height="184" rx="22" fill="#f7f3ff" stroke="#d1c5f5" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="368" r="19" fill="#7863b6"/><text x="579" y="374" text-anchor="middle" class="number">2</text><text x="611" y="373" class="eyebrow">ШКАЛА</text><text x="567" y="412" class="heading">Последовательность Фибоначчи</text><text x="567" y="440" class="body">Частые значения: 1, 2, 3, 5, 8, 13, 21. Чем больше задача,</text><text x="567" y="461" class="body">тем выше неопределённость.</text><rect x="32" y="532" width="491" height="199" rx="22" fill="#effbf6" stroke="#b8e4d0" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="570" r="19" fill="#23866a"/><text x="70" y="576" text-anchor="middle" class="number">3</text><text x="102" y="575" class="eyebrow">КАК ИГРАЮТ</text><text x="58" y="614" class="heading">Пять шагов</text><text x="58" y="642" class="body">Уточнить задачу → выбрать карту независимо → открыть</text><text x="58" y="663" class="body">одновременно → обсудить крайние оценки → повторить</text><text x="58" y="684" class="body">голосование.</text><rect x="541" y="532" width="491" height="199" rx="22" fill="#fff8e9" stroke="#f0d89e" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="570" r="19" fill="#c18b2e"/><text x="579" y="576" text-anchor="middle" class="number">4</text><text x="611" y="575" class="eyebrow">ЭТАЛОН</text><text x="567" y="614" class="heading">Задача на 1 SP</text><text x="567" y="642" class="body">Команда выбирает понятную задачу за 1 SP и сравнивает</text><text x="567" y="663" class="body">остальные с ней по относительной сложности.</text><rect x="32" y="749" width="491" height="199" rx="22" fill="#fff3f5" stroke="#edc4ce" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="787" r="19" fill="#b65b75"/><text x="70" y="793" text-anchor="middle" class="number">5</text><text x="102" y="792" class="eyebrow">СПЕЦИАЛЬНЫЕ КАРТЫ</text><text x="58" y="831" class="heading">Сигналы команды</text><text x="58" y="859" class="body">? — нужны уточнения; ∞ — задача слишком большая; ☕ —</text><text x="58" y="880" class="body">перерыв.</text><rect x="541" y="749" width="491" height="199" rx="22" fill="#effaff" stroke="#b8e4ee" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="787" r="19" fill="#287e9a"/><text x="579" y="793" text-anchor="middle" class="number">6</text><text x="611" y="792" class="eyebrow">VELOCITY</text><text x="567" y="831" class="heading">Исторический ориентир</text><text x="567" y="859" class="body">Среднее число Story Points, закрытых за спринт. Помогает</text><text x="567" y="880" class="body">планировать, но не является оценкой производительности</text><text x="567" y="901" class="body">людей.</text>
<rect x="32" y="978" width="1000" height="132" rx="24" fill="#eaf5ff" stroke="#8dbce9" stroke-width="2"/>
<circle cx="80" cy="1048" r="25" fill="#2f65ad"/><path d="M68 1048l8 8 16-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="124" y="1031" class="footerTitle">ЗАПОМНИ</text><text x="124" y="1064" class="footer">Одновременное открытие карт уменьшает эффект якоря: первая озвученная цифра не задаёт оценки всей команде.</text>
<text x="34" y="1149" class="brand">QA Navigator</text>
</svg>
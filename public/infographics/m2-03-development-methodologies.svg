<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 1476" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
<title id="title">Методологии разработки ПО</title><desc id="desc">Подход определяет, как команда проходит путь от требований до релиза и реагирует на изменения.</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fcff"/><stop offset="1" stop-color="#fffaff"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#174da1" flood-opacity=".09"/></filter>
<style>
.title{font:800 43px Arial,sans-serif;fill:#082d6c}.tag{font:800 15px Arial,sans-serif;letter-spacing:2px;fill:#2456a6}
.subtitle{font:600 18px Arial,sans-serif;fill:#315477}.flow{font:800 17px Arial,sans-serif;fill:#173e7b}
.eyebrow{font:800 14px Arial,sans-serif;letter-spacing:1px;fill:#315b9b}.heading{font:800 20px Arial,sans-serif;fill:#123d83}
.body{font:600 14px Arial,sans-serif;fill:#315477}.number{font:800 16px Arial,sans-serif;fill:#fff}
.footerTitle{font:800 17px Arial,sans-serif;fill:#174a91}.footer{font:600 16px Arial,sans-serif;fill:#315477}
</style></defs>
<rect width="1065" height="1476" fill="url(#paper)"/>
<circle cx="1002" cy="88" r="94" fill="#eaf3ff"/><circle cx="1002" cy="88" r="58" fill="#d8e9ff"/>
<text x="34" y="76" class="tag">МОДЕЛИ · ГИБКОСТЬ · РАННЕЕ ТЕСТИРОВАНИЕ</text>
<text x="34" y="143" class="title">Методологии разработки ПО</text>
<text x="34" y="185" class="subtitle">Подход определяет, как команда проходит путь от требований до релиза и реагирует на из…</text>
<rect x="32" y="212" width="1000" height="94" rx="22" fill="#fff" stroke="#c8ddf4" stroke-width="2"/>
<text x="54" y="226" class="eyebrow">КЛЮЧЕВАЯ СХЕМА</text><rect x="32" y="230" width="190.4" height="62" rx="16" fill="#e8f3ff" stroke="#9fc7f2" stroke-width="2"/><text x="127.2" y="268" text-anchor="middle" class="flow">Требования</text><rect x="234.4" y="230" width="190.4" height="62" rx="16" fill="#f1edff" stroke="#c4b5fd" stroke-width="2"/><text x="329.6" y="268" text-anchor="middle" class="flow">Проектирование</text><rect x="436.8" y="230" width="190.4" height="62" rx="16" fill="#e8faf3" stroke="#9cdec6" stroke-width="2"/><text x="532" y="268" text-anchor="middle" class="flow">Разработка</text><rect x="639.2" y="230" width="190.4" height="62" rx="16" fill="#fff5df" stroke="#f0d28a" stroke-width="2"/><text x="734.4000000000001" y="268" text-anchor="middle" class="flow">Тестирование</text><rect x="841.6" y="230" width="190.4" height="62" rx="16" fill="#fff0f3" stroke="#efb7c6" stroke-width="2"/><text x="936.8000000000001" y="268" text-anchor="middle" class="flow">Релиз</text>
<rect x="32" y="330" width="491" height="150" rx="22" fill="#f2f8ff" stroke="#b9d7f5" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="368" r="19" fill="#315fae"/><text x="70" y="374" text-anchor="middle" class="number">1</text><text x="102" y="373" class="eyebrow">WATERFALL</text><text x="58" y="413" class="heading">Последовательная модель</text><text x="58" y="441" class="body">Этапы идут друг за другом. Предсказуемость выше при</text><text x="58" y="463" class="body">стабильных требованиях; поздние изменения могут быть</text><text x="58" y="485" class="body">дорогими.</text><rect x="541" y="330" width="491" height="150" rx="22" fill="#f7f3ff" stroke="#d1c5f5" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="368" r="19" fill="#7863b6"/><text x="579" y="374" text-anchor="middle" class="number">2</text><text x="611" y="373" class="eyebrow">V-MODEL</text><text x="567" y="413" class="heading">Разработка ↔ тестирование</text><text x="567" y="441" class="body">Этапам разработки заранее соответствуют проверки:</text><text x="567" y="463" class="body">требования — приёмочные, архитектура — системные, код —</text><text x="567" y="485" class="body">модульные.</text><rect x="32" y="498" width="491" height="150" rx="22" fill="#effbf6" stroke="#b8e4d0" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="536" r="19" fill="#23866a"/><text x="70" y="542" text-anchor="middle" class="number">3</text><text x="102" y="541" class="eyebrow">ITERATIVE</text><text x="58" y="581" class="heading">Повторяющиеся циклы</text><text x="58" y="609" class="body">Продукт развивается постепенно: каждая итерация</text><text x="58" y="631" class="body">добавляет часть функциональности.</text><rect x="541" y="498" width="491" height="150" rx="22" fill="#fff8e9" stroke="#f0d89e" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="536" r="19" fill="#c18b2e"/><text x="579" y="542" text-anchor="middle" class="number">4</text><text x="611" y="541" class="eyebrow">SPIRAL</text><text x="567" y="581" class="heading">Циклы с анализом рисков</text><text x="567" y="609" class="body">На каждом витке оценивают риски и создают прототип или</text><text x="567" y="631" class="body">результат следующего этапа.</text><rect x="32" y="666" width="491" height="150" rx="22" fill="#fff3f5" stroke="#edc4ce" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="704" r="19" fill="#b65b75"/><text x="70" y="710" text-anchor="middle" class="number">5</text><text x="102" y="709" class="eyebrow">AGILE</text><text x="58" y="749" class="heading">Гибкий подход</text><text x="58" y="777" class="body">Короткие циклы и адаптация к изменениям. Scrum, Kanban и</text><text x="58" y="799" class="body">XP относятся к семейству Agile-подходов.</text><rect x="541" y="666" width="491" height="150" rx="22" fill="#effaff" stroke="#b8e4ee" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="704" r="19" fill="#287e9a"/><text x="579" y="710" text-anchor="middle" class="number">6</text><text x="611" y="709" class="eyebrow">SCRUM / KANBAN</text><text x="567" y="749" class="heading">Разные способы организации</text><text x="567" y="777" class="body">Scrum использует фиксированные спринты; Kanban управляет</text><text x="567" y="799" class="body">непрерывным потоком и WIP-лимитами.</text>
<rect x="32" y="1250" width="1000" height="142" rx="24" fill="#eaf5ff" stroke="#8dbce9" stroke-width="2"/>
<circle cx="80" cy="1320" r="25" fill="#2f65ad"/><path d="M68 1320l8 8 16-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="124" y="1303" class="footerTitle">ЗАПОМНИ</text>
<text x="124" y="1336" class="footer">Shift-Left: начинай тестовые активности раньше — уже при анализе требований и проектировании, а не только пере…</text>
<text x="34" y="1438" class="eyebrow">QA NAVIGATOR · БАЗА ЗНАНИЙ · РЕЖИМ ОБУЧЕНИЯ</text>
</svg>
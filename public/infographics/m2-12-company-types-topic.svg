<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 1476" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
<title id="title">Типы компаний</title><desc id="desc">В исходном уроке пока нет текстового конспекта. Эта карточка отмечает тему, не подменяя отсутствующий материал.</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fcff"/><stop offset="1" stop-color="#fffaff"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#174da1" flood-opacity=".09"/></filter>
<style>
.title{font:800 43px Arial,sans-serif;fill:#082d6c}.tag{font:800 15px Arial,sans-serif;letter-spacing:2px;fill:#2456a6}
.subtitle{font:600 18px Arial,sans-serif;fill:#315477}.flow{font:800 17px Arial,sans-serif;fill:#173e7b}
.eyebrow{font:800 14px Arial,sans-serif;letter-spacing:1px;fill:#315b9b}.heading{font:800 20px Arial,sans-serif;fill:#123d83}
.body{font:600 14px Arial,sans-serif;fill:#315477}.number{font:800 16px Arial,sans-serif;fill:#fff}
.footerTitle{font:800 17px Arial,sans-serif;fill:#174a91}.footer{font:600 16px Arial,sans-serif;fill:#315477}
</style></defs>
<rect width="1065" height="1476" fill="url(#paper)"/>
<circle cx="1002" cy="88" r="94" fill="#eaf3ff"/><circle cx="1002" cy="88" r="58" fill="#d8e9ff"/>
<text x="34" y="76" class="tag">КАРТА ТЕМЫ · МАТЕРИАЛ ОЖИДАЕТ ДОБАВЛЕНИЯ</text>
<text x="34" y="143" class="title">Типы компаний</text>
<text x="34" y="185" class="subtitle">В исходном уроке пока нет текстового конспекта. Эта карточка отмечает тему, не подменя…</text>
<rect x="32" y="212" width="1000" height="94" rx="22" fill="#fff" stroke="#c8ddf4" stroke-width="2"/>
<text x="54" y="226" class="eyebrow">КЛЮЧЕВАЯ СХЕМА</text><rect x="32" y="230" width="241" height="62" rx="16" fill="#e8f3ff" stroke="#9fc7f2" stroke-width="2"/><text x="152.5" y="268" text-anchor="middle" class="flow">Контекст</text><rect x="285" y="230" width="241" height="62" rx="16" fill="#f1edff" stroke="#c4b5fd" stroke-width="2"/><text x="405.5" y="268" text-anchor="middle" class="flow">Структура</text><rect x="538" y="230" width="241" height="62" rx="16" fill="#e8faf3" stroke="#9cdec6" stroke-width="2"/><text x="658.5" y="268" text-anchor="middle" class="flow">Процессы</text><rect x="791" y="230" width="241" height="62" rx="16" fill="#fff5df" stroke="#f0d28a" stroke-width="2"/><text x="911.5" y="268" text-anchor="middle" class="flow">Роль QA</text>
<rect x="32" y="330" width="491" height="190" rx="22" fill="#f2f8ff" stroke="#b9d7f5" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="368" r="19" fill="#315fae"/><text x="70" y="374" text-anchor="middle" class="number">1</text><text x="102" y="373" class="eyebrow">ТЕМА УРОКА</text><text x="58" y="413" class="heading">Типы компаний</text><text x="58" y="441" class="body">Название темы сохранено. В исходной записи нет</text><text x="58" y="463" class="body">определений или перечня типов компаний.</text><rect x="541" y="330" width="491" height="190" rx="22" fill="#f7f3ff" stroke="#d1c5f5" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="368" r="19" fill="#7863b6"/><text x="579" y="374" text-anchor="middle" class="number">2</text><text x="611" y="373" class="eyebrow">НЕ ДОПОЛНЯЕМ ЗА АВТОРА</text><text x="567" y="413" class="heading">Без вымышленных классификаций</text><text x="567" y="441" class="body">Инфографика не вводит новые категории, критерии или</text><text x="567" y="463" class="body">примеры, которых нет в учебном источнике.</text><rect x="32" y="538" width="491" height="190" rx="22" fill="#effbf6" stroke="#b8e4d0" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="576" r="19" fill="#23866a"/><text x="70" y="582" text-anchor="middle" class="number">3</text><text x="102" y="581" class="eyebrow">ЧТО НУЖНО ДЛЯ ПОЛНОЙ КАРТЫ</text><text x="58" y="621" class="heading">Исходный конспект</text><text x="58" y="649" class="body">После добавления материала визуальную схему можно</text><text x="58" y="671" class="body">построить по фактическим определениям и примерам.</text><rect x="541" y="538" width="491" height="190" rx="22" fill="#fff8e9" stroke="#f0d89e" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="576" r="19" fill="#c18b2e"/><text x="579" y="582" text-anchor="middle" class="number">4</text><text x="611" y="581" class="eyebrow">КОНТРОЛЬ КАЧЕСТВА</text><text x="567" y="621" class="heading">Сверка с источником</text><text x="567" y="649" class="body">Любые будущие подписи и сравнения должны соответствовать</text><text x="567" y="671" class="body">содержанию самого урока.</text>
<rect x="32" y="1250" width="1000" height="142" rx="24" fill="#eaf5ff" stroke="#8dbce9" stroke-width="2"/>
<circle cx="80" cy="1320" r="25" fill="#2f65ad"/><path d="M68 1320l8 8 16-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="124" y="1303" class="footerTitle">ЗАПОМНИ</text>
<text x="124" y="1336" class="footer">Сейчас это навигационная карточка темы, а не конспект: содержательные определения появятся только вместе с исх…</text>
<text x="34" y="1438" class="eyebrow">QA NAVIGATOR · БАЗА ЗНАНИЙ · РЕЖИМ ОБУЧЕНИЯ</text>
</svg>
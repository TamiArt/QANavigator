<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 1476" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
<title id="title">Фреймворк Scrum (Скрам)</title>
<desc id="desc">Учебная инфографика по Scrum: суть фреймворка, роли, артефакты, Sprint и события, плюсы и минусы, Definition of Ready и Done, Story Points и Refinement.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fcff"/><stop offset="1" stop-color="#fffaff"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173f8f" flood-opacity=".08"/></filter>
  <style>
    .title{font:800 45px Arial,sans-serif;fill:#082d6c}.tag{font:800 20px Arial,sans-serif;fill:#174da1}
    .h{font:800 21px Arial,sans-serif;fill:#103c82}.h2{font:800 15px Arial,sans-serif;fill:#123f86}
    .body{font:600 14px Arial,sans-serif;fill:#244c88}.small{font:600 12px Arial,sans-serif;fill:#315a91}
    .tiny{font:600 10.8px Arial,sans-serif;fill:#315a91}.num{font:800 27px Arial,sans-serif;fill:#fff}
    .label{font:800 15px Arial,sans-serif;fill:#123d83}.card{stroke-width:2}
    .line{stroke:#174da1;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
  </style>

  <symbol id="lightbulb" viewBox="0 0 90 110">
    <path d="M45 8c-20 0-34 16-34 35 0 13 6 22 16 30 5 4 7 8 8 14h20c1-6 3-10 8-14 10-8 16-17 16-30C79 24 65 8 45 8z" fill="#ffd65c" stroke="#164aa0" stroke-width="4"/>
    <path d="M34 89h22M35 98h20" class="line" stroke-width="5"/><path d="M45 2V0M14 17 5 9M76 17l9-8M4 48H0M86 48h4" class="line" stroke-width="3"/>
  </symbol>
  <symbol id="target" viewBox="0 0 90 90">
    <circle cx="42" cy="44" r="27" fill="#fff" stroke="#174da1" stroke-width="4"/><circle cx="42" cy="44" r="15" fill="#dcecff" stroke="#174da1" stroke-width="4"/><circle cx="42" cy="44" r="5" fill="#174da1"/><path d="M48 50 78 20M67 20h11v11" class="line"/>
  </symbol>
  <symbol id="team" viewBox="0 0 100 90">
    <circle cx="50" cy="26" r="13" fill="#f3c39c" stroke="#174da1" stroke-width="3"/><circle cx="23" cy="34" r="10" fill="#f0b68f" stroke="#174da1" stroke-width="3"/><circle cx="77" cy="34" r="10" fill="#e8ad86" stroke="#174da1" stroke-width="3"/>
    <path d="M28 67c3-17 14-26 22-26s19 9 22 26" fill="#4f64ba" stroke="#174da1" stroke-width="3"/><path d="M4 69c2-14 10-21 19-21 7 0 13 4 17 12M96 69c-2-14-10-21-19-21-7 0-13 4-17 12" fill="#6a83d4" stroke="#174da1" stroke-width="3"/>
  </symbol>
  <symbol id="gear" viewBox="0 0 90 90">
    <path d="M38 7h14l3 10a29 29 0 0 1 8 5l10-3 7 12-8 7a29 29 0 0 1 0 10l8 7-7 12-10-3a29 29 0 0 1-8 5l-3 10H38l-3-10a29 29 0 0 1-8-5l-10 3-7-12 8-7a29 29 0 0 1 0-10l-8-7 7-12 10 3a29 29 0 0 1 8-5z" fill="#8eb0ff" stroke="#174da1" stroke-width="4"/><circle cx="45" cy="43" r="13" fill="#fff" stroke="#174da1" stroke-width="4"/>
  </symbol>
  <symbol id="document" viewBox="0 0 90 100">
    <path d="M18 8h40l15 15v69H18z" fill="#fff" stroke="#174da1" stroke-width="4"/><path d="M58 8v17h15M30 40h31M30 54h31M30 68h22" class="line" stroke-width="4"/>
  </symbol>
  <symbol id="chat" viewBox="0 0 100 90">
    <path d="M10 12h55c10 0 18 8 18 18v24c0 10-8 18-18 18H38L20 84l4-12H10c-5 0-8-4-8-9V30c0-10 8-18 18-18z" fill="#fff" stroke="#174da1" stroke-width="4"/><path d="M28 43h4M44 43h4M60 43h4" stroke="#174da1" stroke-width="7" stroke-linecap="round"/>
  </symbol>
  <symbol id="clipboard" viewBox="0 0 120 120">
    <rect x="25" y="17" width="70" height="91" rx="7" fill="#fff" stroke="#174da1" stroke-width="4" transform="rotate(-8 60 62)"/><rect x="46" y="10" width="28" height="12" rx="6" fill="#d9e7ff" stroke="#174da1" stroke-width="4" transform="rotate(-8 60 62)"/>
    <path d="M40 44h35M40 59h35M40 74h25" class="line" stroke-width="4" transform="rotate(-8 60 62)"/><circle cx="80" cy="86" r="21" fill="#38bd8c" stroke="#174da1" stroke-width="4"/><path d="m70 86 7 7 13-16" stroke="#fff" stroke-width="5" fill="none"/>
  </symbol>
  <symbol id="checklist" viewBox="0 0 90 100">
    <rect x="18" y="10" width="54" height="78" rx="5" fill="#fff" stroke="#174da1" stroke-width="4"/><path d="M30 31h8M48 31h12M30 47h8M48 47h12M30 63h8M48 63h12" class="line" stroke-width="4"/><path d="m30 30 3 3 6-7M30 46l3 3 6-7M30 62l3 3 6-7" stroke="#51b98a" stroke-width="4" fill="none"/>
  </symbol>
  <symbol id="calendar" viewBox="0 0 90 90">
    <rect x="10" y="17" width="70" height="62" rx="8" fill="#fff" stroke="#174da1" stroke-width="4"/><path d="M10 35h70M25 8v18M65 8v18" class="line"/><path d="M25 49h0M45 49h0M65 49h0M25 64h0M45 64h0M65 64h0" stroke="#174da1" stroke-width="7" stroke-linecap="round"/>
  </symbol>
  <symbol id="sprint" viewBox="0 0 220 130">
    <rect x="12" y="20" width="178" height="98" rx="10" fill="#dcecff" stroke="#174da1" stroke-width="4"/><rect x="27" y="34" width="148" height="67" rx="6" fill="#fff" stroke="#8eafe6" stroke-width="2"/>
    <rect x="39" y="45" width="22" height="18" rx="2" fill="#f8ca63"/><rect x="67" y="45" width="22" height="18" rx="2" fill="#ef7f73"/><rect x="39" y="70" width="22" height="18" rx="2" fill="#f4b9d9"/><rect x="67" y="70" width="22" height="18" rx="2" fill="#69c9a0"/>
    <path d="M116 47a28 28 0 1 0 17 31" fill="none" stroke="#4964d5" stroke-width="10"/><path d="m139 77-11-2 5-11" fill="#4964d5"/><text x="105" y="73" class="h2" font-size="19">SPRINT</text>
  </symbol>
  <symbol id="star" viewBox="0 0 90 90"><path d="m45 7 10 24 26 2-20 17 6 26-22-14-22 14 6-26L9 33l26-2z" fill="#8cb4ff" stroke="#174da1" stroke-width="4"/></symbol>
</defs>

<rect width="1065" height="1476" fill="url(#paper)"/>

<!-- Header -->
<rect x="22" y="18" width="225" height="40" rx="20" fill="#dceaff"/>
<text x="40" y="45" class="label">Модуль 2 · Урок 4 из 12</text>
<text x="24" y="104" class="title">Фреймворк Scrum</text>
<text x="24" y="151" class="title">(Скрам)</text>
<text x="28" y="181" class="tag">Больше ценности каждый спринт!</text>
<rect x="750" y="25" width="285" height="128" rx="24" fill="#eaf8ff" stroke="#8adcf4" stroke-width="2"/>
<use href="#sprint" x="770" y="39" width="120" height="71"/>
<text x="905" y="66" class="h" font-size="20">SCRUM</text>
<text x="905" y="94" class="body">1–4 недели</text>
<text x="905" y="119" class="small">короткий цикл →</text>
<text x="905" y="138" class="small">готовый инкремент</text>

<!-- 1 Main idea -->
<rect x="12" y="205" width="515" height="315" rx="20" fill="#eaf8ff" stroke="#8adcf4" class="card" filter="url(#shadow)"/>
<circle cx="55" cy="243" r="30" fill="#2553a8"/><text x="46" y="254" class="num">1</text>
<text x="97" y="250" class="h">Главная суть</text>
<use href="#lightbulb" x="32" y="287" width="78" height="95"/>
<text x="128" y="292" class="body">Scrum — фреймворк внутри</text>
<text x="128" y="314" class="body">гибкого подхода Agile.</text>
<text x="128" y="345" class="body">Работа делится на короткие</text>
<text x="128" y="367" class="body">фиксированные спринты:</text>
<text x="128" y="389" class="body">от 1 до 4 недель.</text>
<rect x="128" y="414" width="363" height="77" rx="14" fill="#fff" stroke="#8adcf4" stroke-width="2"/>
<text x="147" y="438" class="h2">В конце каждого Sprint</text>
<text x="147" y="459" class="small">команда отдаёт готовый, работающий</text>
<text x="147" y="478" class="small">инкремент — кусок продукта.</text>

<!-- 2 Roles -->
<rect x="545" y="205" width="508" height="315" rx="20" fill="#f4f0ff" stroke="#cbb8f7" class="card" filter="url(#shadow)"/>
<circle cx="588" cy="243" r="30" fill="#4b4f9f"/><text x="579" y="254" class="num">2</text>
<text x="630" y="250" class="h">Три обязательные роли</text>

<rect x="563" y="270" width="230" height="105" rx="15" fill="#fff" stroke="#cbb8f7" stroke-width="2"/>
<use href="#target" x="576" y="282" width="45" height="45"/><text x="632" y="293" class="h2">Product Owner</text>
<text x="632" y="312" class="tiny">• голос бизнеса и клиента</text><text x="632" y="328" class="tiny">• ценность продукта</text><text x="632" y="344" class="tiny">• бэклог и приоритеты</text><text x="632" y="360" class="tiny">• управляет списком задач</text>

<rect x="805" y="270" width="230" height="105" rx="15" fill="#fff" stroke="#cbb8f7" stroke-width="2"/>
<use href="#gear" x="818" y="282" width="45" height="45"/><text x="874" y="293" class="h2">Scrum Master</text>
<text x="874" y="312" class="tiny">• тренер и фасилитатор</text><text x="874" y="328" class="tiny">• не является начальником</text><text x="874" y="344" class="tiny">• соблюдение правил Scrum</text><text x="874" y="360" class="tiny">• помогает убрать блокеры</text>

<rect x="563" y="389" width="472" height="111" rx="15" fill="#fff" stroke="#cbb8f7" stroke-width="2"/>
<use href="#team" x="580" y="405" width="60" height="54"/><text x="652" y="412" class="h2">Developers / Cross-functional Team</text>
<text x="652" y="432" class="tiny">• кросс-функциональная: разработчики, QA, дизайнеры, аналитики</text>
<text x="652" y="450" class="tiny">• самоорганизуемая: сама решает, как выполнять задачи</text>
<text x="652" y="468" class="tiny">• отвечает за выполнение работы внутри Sprint</text>

<!-- 3 Artifacts -->
<rect x="12" y="542" width="515" height="365" rx="20" fill="#fffaf0" stroke="#f0d48a" class="card" filter="url(#shadow)"/>
<circle cx="55" cy="580" r="30" fill="#3654a5"/><text x="46" y="591" class="num">3</text>
<text x="97" y="587" class="h">Главные артефакты</text>
<text x="97" y="611" class="small">Инструменты работы команды</text>

<rect x="28" y="630" width="483" height="77" rx="14" fill="#fff" stroke="#ecd28e" stroke-width="2"/>
<use href="#document" x="42" y="641" width="43" height="50"/><text x="98" y="651" class="h2">Product Backlog</text>
<text x="98" y="670" class="small">Единый постоянно обновляемый список задач, требований и идей.</text>
<text x="98" y="689" class="small">Вверху — самые важные и срочные задачи.</text>

<rect x="28" y="718" width="483" height="77" rx="14" fill="#fff" stroke="#ecd28e" stroke-width="2"/>
<use href="#clipboard" x="40" y="729" width="48" height="48"/><text x="98" y="739" class="h2">Sprint Backlog</text>
<text x="98" y="758" class="small">Набор задач, взятых из Product Backlog</text>
<text x="98" y="777" class="small">на конкретный текущий Sprint.</text>

<rect x="28" y="806" width="483" height="83" rx="14" fill="#fff" stroke="#ecd28e" stroke-width="2"/>
<use href="#checklist" x="42" y="818" width="43" height="50"/><text x="98" y="827" class="h2">Increment</text>
<text x="98" y="846" class="small">Готовый к использованию, протестированный</text>
<text x="98" y="865" class="small">кусок продукта в конце Sprint.</text>

<!-- 4 Events -->
<rect x="545" y="542" width="508" height="365" rx="20" fill="#eafcff" stroke="#79d9ee" class="card" filter="url(#shadow)"/>
<circle cx="588" cy="580" r="30" fill="#287b87"/><text x="579" y="591" class="num">4</text>
<text x="630" y="587" class="h">Sprint и ключевые события</text>
<rect x="563" y="619" width="472" height="47" rx="13" fill="#d9f5ff" stroke="#79d9ee" stroke-width="2"/>
<use href="#calendar" x="573" y="624" width="35" height="35"/><text x="620" y="640" class="h2">Sprint — контейнер</text><text x="620" y="657" class="tiny">фиксированный отрезок: от идеи из Backlog → к работающему Increment</text>

<rect x="563" y="676" width="472" height="49" rx="13" fill="#fff" stroke="#79d9ee" stroke-width="2"/>
<circle cx="587" cy="700" r="14" fill="#35bce3"/><text x="582" y="705" class="num" font-size="13">1</text><text x="612" y="696" class="h2">Sprint Planning</text><text x="612" y="712" class="tiny">выбираем задачи и формулируем цель Sprint</text>

<rect x="563" y="735" width="472" height="49" rx="13" fill="#fff" stroke="#79d9ee" stroke-width="2"/>
<circle cx="587" cy="759" r="14" fill="#35bce3"/><text x="582" y="764" class="num" font-size="13">2</text><text x="612" y="755" class="h2">Daily Scrum</text><text x="612" y="771" class="tiny">15 минут: вчера → сегодня → проблемы / блокеры</text>

<rect x="563" y="794" width="472" height="49" rx="13" fill="#fff" stroke="#79d9ee" stroke-width="2"/>
<circle cx="587" cy="818" r="14" fill="#35bce3"/><text x="582" y="823" class="num" font-size="13">3</text><text x="612" y="814" class="h2">Sprint Review / Demo</text><text x="612" y="830" class="tiny">в конце Sprint показываем результат заказчику и стейкхолдерам</text>

<rect x="563" y="853" width="472" height="38" rx="13" fill="#fff" stroke="#79d9ee" stroke-width="2"/>
<circle cx="587" cy="872" r="14" fill="#35bce3"/><text x="582" y="877" class="num" font-size="13">4</text><text x="612" y="868" class="h2">Sprint Retrospective</text><text x="612" y="884" class="tiny">что улучшить в процессах на следующий Sprint</text>

<!-- 5 Pros / cons -->
<rect x="12" y="929" width="515" height="365" rx="20" fill="#eafbf4" stroke="#77d7bc" class="card" filter="url(#shadow)"/>
<circle cx="55" cy="967" r="30" fill="#15956e"/><text x="46" y="978" class="num">5</text>
<text x="97" y="974" class="h">Плюсы и минусы</text>
<rect x="30" y="1010" width="229" height="258" rx="17" fill="#fff" stroke="#77d7bc" stroke-width="2"/>
<circle cx="58" cy="1040" r="17" fill="#38bd8c"/><text x="52" y="1047" class="num" font-size="18">✓</text><text x="86" y="1047" class="h2">Плюсы</text>
<text x="49" y="1081" class="body">• Быстрая обратная связь.</text>
<text x="49" y="1114" class="body">• Гибкость к изменениям.</text>
<text x="49" y="1147" class="body">• Видимый результат</text><text x="49" y="1167" class="body">  каждые 1–4 недели.</text>
<use href="#star" x="155" y="1191" width="60" height="60"/>

<rect x="278" y="1010" width="229" height="258" rx="17" fill="#fff" stroke="#f0a6ad" stroke-width="2"/>
<circle cx="306" cy="1040" r="17" fill="#ef7f73"/><text x="299" y="1047" class="num" font-size="18">×</text><text x="334" y="1047" class="h2">Минусы</text>
<text x="297" y="1081" class="body">• Накладные расходы</text><text x="297" y="1101" class="body">  времени: много созвонов.</text>
<text x="297" y="1134" class="body">• Сложно применять</text><text x="297" y="1154" class="body">  в огромных компаниях</text><text x="297" y="1174" class="body">  без специальных</text><text x="297" y="1194" class="body">  надстроек.</text>
<use href="#gear" x="417" y="1203" width="55" height="55"/>

<!-- 6 Advanced -->
<rect x="545" y="929" width="508" height="365" rx="20" fill="#f5f1ff" stroke="#c7b9f4" class="card" filter="url(#shadow)"/>
<circle cx="588" cy="967" r="30" fill="#4b4f9f"/><text x="579" y="978" class="num">6</text>
<text x="630" y="974" class="h">5+ · что важно знать</text>

<rect x="563" y="1008" width="472" height="77" rx="14" fill="#fff" stroke="#c7b9f4" stroke-width="2"/>
<use href="#checklist" x="576" y="1019" width="40" height="45"/><text x="626" y="1028" class="h2">DoR vs DoD</text>
<text x="626" y="1047" class="tiny">DoR — задача достаточно описана и понятна, чтобы брать в Sprint.</text>
<text x="626" y="1065" class="tiny">DoD — код написан, протестирован, прошёл ревью и готов к стенду.</text>

<rect x="563" y="1095" width="472" height="77" rx="14" fill="#fff" stroke="#c7b9f4" stroke-width="2"/>
<use href="#target" x="576" y="1108" width="40" height="40"/><text x="626" y="1117" class="h2">Story Points</text>
<text x="626" y="1136" class="tiny">Относительные единицы сложности, а не часы / дни.</text>
<text x="626" y="1154" class="tiny">Часто используют Фибоначчи: 1, 2, 3, 5, 8, 13…</text>

<rect x="563" y="1182" width="472" height="94" rx="14" fill="#fff" stroke="#c7b9f4" stroke-width="2"/>
<use href="#chat" x="576" y="1196" width="43" height="40"/><text x="626" y="1205" class="h2">Grooming / Refinement</text>
<text x="626" y="1224" class="tiny">Регулярная встреча: команда заранее разбирает</text>
<text x="626" y="1242" class="tiny">и оценивает задачи из Backlog для будущих Sprint.</text>
<text x="626" y="1260" class="tiny">Цель — сделать будущую работу понятнее и подготовленнее.</text>

<!-- Footer memory cue -->
<rect x="16" y="1320" width="1033" height="111" rx="28" fill="#e9f8ff" stroke="#7cccf1" stroke-width="2"/>
<use href="#sprint" x="48" y="1340" width="105" height="62"/>
<text x="180" y="1351" class="h2" font-size="17">Запомнить:</text>
<text x="180" y="1375" class="body">Scrum = роли + артефакты + события → короткий Sprint →</text>
<text x="180" y="1397" class="body">готовый Increment + обратная связь + улучшение следующего цикла.</text>
<text x="180" y="1418" class="small">PO отвечает за ценность · Scrum Master помогает процессу · команда создаёт Increment</text>
</svg>
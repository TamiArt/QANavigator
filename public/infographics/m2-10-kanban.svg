<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 1136" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
<title id="title">Kanban</title><desc id="desc">Kanban помогает видеть движение задач, ограничивать незавершённую работу и находить уз…</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fcff"/><stop offset="1" stop-color="#fffaff"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#174da1" flood-opacity=".09"/></filter>
<style>
.title{font:800 43px Arial,sans-serif;fill:#082d6c}.tag{font:800 15px Arial,sans-serif;letter-spacing:2px;fill:#2456a6}
.subtitle{font:600 18px Arial,sans-serif;fill:#315477}.flow{font:800 17px Arial,sans-serif;fill:#173e7b}
.eyebrow{font:800 14px Arial,sans-serif;letter-spacing:1px;fill:#315b9b}.heading{font:800 20px Arial,sans-serif;fill:#123d83}
.body{font:600 14px Arial,sans-serif;fill:#315477}.number{font:800 16px Arial,sans-serif;fill:#fff}
.footerTitle{font:800 17px Arial,sans-serif;fill:#174a91}.footer{font:600 16px Arial,sans-serif;fill:#315477}
.brand{font:700 12px Arial,sans-serif;letter-spacing:.2px;fill:#8aa5c5}
</style></defs>
<rect width="1065" height="1136" fill="url(#paper)"/>
<circle cx="1002" cy="88" r="94" fill="#eaf3ff"/><circle cx="1002" cy="88" r="58" fill="#d8e9ff"/>
<text x="34" y="76" class="tag">НЕПРЕРЫВНЫЙ ПОТОК · WIP · ПРОЗРАЧНОСТЬ</text><text x="34" y="143" class="title">Kanban</text><text x="34" y="185" class="subtitle">Kanban помогает видеть движение задач, ограничивать незавершённую работу и находить уз…</text>
<rect x="32" y="212" width="1000" height="94" rx="22" fill="#fff" stroke="#c8ddf4" stroke-width="2"/>
<text x="54" y="237" class="eyebrow">КЛЮЧЕВАЯ СХЕМА</text><rect x="32" y="244" width="190.4" height="62" rx="16" fill="#e8f3ff" stroke="#9fc7f2" stroke-width="2"/><text x="127.2" y="277" text-anchor="middle" class="flow">Бэклог</text><rect x="234.4" y="244" width="190.4" height="62" rx="16" fill="#f1edff" stroke="#c4b5fd" stroke-width="2"/><text x="329.6" y="277" text-anchor="middle" class="flow">В работе</text><rect x="436.8" y="244" width="190.4" height="62" rx="16" fill="#e8faf3" stroke="#9cdec6" stroke-width="2"/><text x="532" y="277" text-anchor="middle" class="flow">На проверке</text><rect x="639.2" y="244" width="190.4" height="62" rx="16" fill="#fff5df" stroke="#f0d28a" stroke-width="2"/><text x="734.4000000000001" y="277" text-anchor="middle" class="flow">Заблокировано</text><rect x="841.6" y="244" width="190.4" height="62" rx="16" fill="#fff0f3" stroke="#efb7c6" stroke-width="2"/><text x="936.8000000000001" y="277" text-anchor="middle" class="flow">Сделано</text>

<rect x="32" y="330" width="491" height="184" rx="22" fill="#f2f8ff" stroke="#b9d7f5" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="368" r="19" fill="#315fae"/><text x="70" y="374" text-anchor="middle" class="number">1</text><text x="102" y="373" class="eyebrow">КАНБАН-ДОСКА</text><text x="58" y="412" class="heading">Визуальный поток</text><text x="58" y="440" class="body">Показывает путь задачи. Доска не обнуляется в конце</text><text x="58" y="461" class="body">итерации: карточки перемещаются по колонкам.</text><rect x="541" y="330" width="491" height="184" rx="22" fill="#f7f3ff" stroke="#d1c5f5" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="368" r="19" fill="#7863b6"/><text x="579" y="374" text-anchor="middle" class="number">2</text><text x="611" y="373" class="eyebrow">WIP-LIMIT</text><text x="567" y="412" class="heading">Лимит незавершённой работы</text><text x="567" y="440" class="body">Максимальное число задач в колонке. Помогает не</text><text x="567" y="461" class="body">перегружать команду и замечать заторы.</text><rect x="32" y="532" width="491" height="184" rx="22" fill="#effbf6" stroke="#b8e4d0" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="570" r="19" fill="#23866a"/><text x="70" y="576" text-anchor="middle" class="number">3</text><text x="102" y="575" class="eyebrow">BLOCKER</text><text x="58" y="614" class="heading">Причина остановки</text><text x="58" y="642" class="body">Помечай заблокированную задачу и фиксируй причину, чтобы</text><text x="58" y="663" class="body">команда могла устранить препятствие.</text><rect x="541" y="532" width="491" height="184" rx="22" fill="#fff8e9" stroke="#f0d89e" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="570" r="19" fill="#c18b2e"/><text x="579" y="576" text-anchor="middle" class="number">4</text><text x="611" y="575" class="eyebrow">PULL-СИСТЕМА</text><text x="567" y="614" class="heading">Брать задачу по готовности</text><text x="567" y="642" class="body">Исполнитель вытягивает следующую задачу, когда появляется</text><text x="567" y="663" class="body">свободное место в пределах WIP-лимита.</text><rect x="32" y="734" width="491" height="184" rx="22" fill="#fff3f5" stroke="#edc4ce" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="772" r="19" fill="#b65b75"/><text x="70" y="778" text-anchor="middle" class="number">5</text><text x="102" y="777" class="eyebrow">LEAD TIME</text><text x="58" y="816" class="heading">От запроса до релиза</text><text x="58" y="844" class="body">Время от появления задачи до её выпуска.</text><rect x="541" y="734" width="491" height="184" rx="22" fill="#effaff" stroke="#b8e4ee" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="772" r="19" fill="#287e9a"/><text x="579" y="778" text-anchor="middle" class="number">6</text><text x="611" y="777" class="eyebrow">CYCLE TIME</text><text x="567" y="816" class="heading">От старта до завершения</text><text x="567" y="844" class="body">Время с момента, когда задачу взяли в работу, до её</text><text x="567" y="865" class="body">завершения.</text>
<rect x="32" y="948" width="1000" height="132" rx="24" fill="#eaf5ff" stroke="#8dbce9" stroke-width="2"/>
<circle cx="80" cy="1018" r="25" fill="#2f65ad"/><path d="M68 1018l8 8 16-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="124" y="1001" class="footerTitle">ЗАПОМНИ</text><text x="124" y="1034" class="footer">Для QA Kanban подходит для поддержки, срочных баг-фиксов и регрессионных задач с непрерывным входящим</text><text x="124" y="1056" class="footer">потоком.</text>
<text x="34" y="1119" class="brand">QA Navigator</text>
</svg>
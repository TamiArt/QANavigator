<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 1476" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
<title id="title">Sprint Retrospective — Ретроспектива</title><desc id="desc">Команда анализирует прошедший спринт и договаривается о конкретных изменениях в работе.</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fcff"/><stop offset="1" stop-color="#fffaff"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#174da1" flood-opacity=".09"/></filter>
<style>
.title{font:800 43px Arial,sans-serif;fill:#082d6c}.tag{font:800 15px Arial,sans-serif;letter-spacing:2px;fill:#2456a6}
.subtitle{font:600 18px Arial,sans-serif;fill:#315477}.flow{font:800 17px Arial,sans-serif;fill:#173e7b}
.eyebrow{font:800 14px Arial,sans-serif;letter-spacing:1px;fill:#315b9b}.heading{font:800 20px Arial,sans-serif;fill:#123d83}
.body{font:600 14px Arial,sans-serif;fill:#315477}.number{font:800 16px Arial,sans-serif;fill:#fff}
.footerTitle{font:800 17px Arial,sans-serif;fill:#174a91}.footer{font:600 16px Arial,sans-serif;fill:#315477}
</style></defs>
<rect width="1065" height="1476" fill="url(#paper)"/>
<circle cx="1002" cy="88" r="94" fill="#eaf3ff"/><circle cx="1002" cy="88" r="58" fill="#d8e9ff"/>
<text x="34" y="76" class="tag">ОБРАТНАЯ СВЯЗЬ · ПРИЧИНЫ · УЛУЧШЕНИЯ</text>
<text x="34" y="143" class="title">Sprint Retrospective — Ретроспектива</text>
<text x="34" y="185" class="subtitle">Команда анализирует прошедший спринт и договаривается о конкретных изменениях в работе…</text>
<rect x="32" y="212" width="1000" height="94" rx="22" fill="#fff" stroke="#c8ddf4" stroke-width="2"/>
<text x="54" y="226" class="eyebrow">КЛЮЧЕВАЯ СХЕМА</text><rect x="32" y="230" width="190.4" height="62" rx="16" fill="#e8f3ff" stroke="#9fc7f2" stroke-width="2"/><text x="127.2" y="268" text-anchor="middle" class="flow">Подготовить</text><rect x="234.4" y="230" width="190.4" height="62" rx="16" fill="#f1edff" stroke="#c4b5fd" stroke-width="2"/><text x="329.6" y="268" text-anchor="middle" class="flow">Собрать факты</text><rect x="436.8" y="230" width="190.4" height="62" rx="16" fill="#e8faf3" stroke="#9cdec6" stroke-width="2"/><text x="532" y="268" text-anchor="middle" class="flow">Найти причины</text><rect x="639.2" y="230" width="190.4" height="62" rx="16" fill="#fff5df" stroke="#f0d28a" stroke-width="2"/><text x="734.4000000000001" y="268" text-anchor="middle" class="flow">Выбрать действия</text><rect x="841.6" y="230" width="190.4" height="62" rx="16" fill="#fff0f3" stroke="#efb7c6" stroke-width="2"/><text x="936.8000000000001" y="268" text-anchor="middle" class="flow">Закрыть</text>
<rect x="32" y="330" width="491" height="150" rx="22" fill="#f2f8ff" stroke="#b9d7f5" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="368" r="19" fill="#315fae"/><text x="70" y="374" text-anchor="middle" class="number">1</text><text x="102" y="373" class="eyebrow">01 · SET THE STAGE</text><text x="58" y="413" class="heading">Создать безопасную атмосферу</text><text x="58" y="441" class="body">Настроить команду на открытый и уважительный диалог.</text><rect x="541" y="330" width="491" height="150" rx="22" fill="#f7f3ff" stroke="#d1c5f5" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="368" r="19" fill="#7863b6"/><text x="579" y="374" text-anchor="middle" class="number">2</text><text x="611" y="373" class="eyebrow">02 · GATHER DATA</text><text x="567" y="413" class="heading">Собрать факты</text><text x="567" y="441" class="body">Что сработало, что мешало и что удивило команду?</text><rect x="32" y="498" width="491" height="150" rx="22" fill="#effbf6" stroke="#b8e4d0" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="536" r="19" fill="#23866a"/><text x="70" y="542" text-anchor="middle" class="number">3</text><text x="102" y="541" class="eyebrow">03 · GENERATE INSIGHTS</text><text x="58" y="581" class="heading">Найти первопричины</text><text x="58" y="609" class="body">Обсудить закономерности и причины проблем, а не искать</text><text x="58" y="631" class="body">виноватых.</text><rect x="541" y="498" width="491" height="150" rx="22" fill="#fff8e9" stroke="#f0d89e" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="536" r="19" fill="#c18b2e"/><text x="579" y="542" text-anchor="middle" class="number">4</text><text x="611" y="541" class="eyebrow">04 · DECIDE WHAT TO DO</text><text x="567" y="581" class="heading">Выбрать 1–2 действия</text><text x="567" y="609" class="body">Сформулировать конкретные Action Items, которые команда</text><text x="567" y="631" class="body">сможет выполнить.</text><rect x="32" y="666" width="491" height="150" rx="22" fill="#fff3f5" stroke="#edc4ce" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="704" r="19" fill="#b65b75"/><text x="70" y="710" text-anchor="middle" class="number">5</text><text x="102" y="709" class="eyebrow">05 · CLOSE</text><text x="58" y="749" class="heading">Зафиксировать договорённости</text><text x="58" y="777" class="body">Подвести итог и определить, как проверить эффект</text><text x="58" y="799" class="body">улучшений на следующем спринте.</text><rect x="541" y="666" width="491" height="150" rx="22" fill="#effaff" stroke="#b8e4ee" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="704" r="19" fill="#287e9a"/><text x="579" y="710" text-anchor="middle" class="number">6</text><text x="611" y="709" class="eyebrow">ФОРМАТЫ</text><text x="567" y="749" class="heading">Инструменты обсуждения</text><text x="567" y="777" class="body">Start–Stop–Continue; Glad–Sad–Mad; Sailboat: ветер —</text><text x="567" y="799" class="body">помощь, якорь — препятствие, рифы — риски.</text>
<rect x="32" y="1250" width="1000" height="142" rx="24" fill="#eaf5ff" stroke="#8dbce9" stroke-width="2"/>
<circle cx="80" cy="1320" r="25" fill="#2f65ad"/><path d="M68 1320l8 8 16-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="124" y="1303" class="footerTitle">ЗАПОМНИ</text>
<text x="124" y="1336" class="footer">Хорошая ретроспектива заканчивается небольшими конкретными действиями, а не только списком проблем.</text>
<text x="34" y="1438" class="eyebrow">QA NAVIGATOR · БАЗА ЗНАНИЙ · РЕЖИМ ОБУЧЕНИЯ</text>
</svg>
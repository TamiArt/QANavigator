<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 1136" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
<title id="title">Смешанные модели: Scrumban и Kanplan</title><desc id="desc">Смешанные модели соединяют элементы Scrum и Kanban под характер работы команды.</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fcff"/><stop offset="1" stop-color="#fffaff"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#174da1" flood-opacity=".09"/></filter>
<style>
.title{font:800 43px Arial,sans-serif;fill:#082d6c}.tag{font:800 15px Arial,sans-serif;letter-spacing:2px;fill:#2456a6}
.subtitle{font:600 18px Arial,sans-serif;fill:#315477}.flow{font:800 17px Arial,sans-serif;fill:#173e7b}
.eyebrow{font:800 14px Arial,sans-serif;letter-spacing:1px;fill:#315b9b}.heading{font:800 20px Arial,sans-serif;fill:#123d83}
.body{font:600 14px Arial,sans-serif;fill:#315477}.number{font:800 16px Arial,sans-serif;fill:#fff}
.footerTitle{font:800 17px Arial,sans-serif;fill:#174a91}.footer{font:600 16px Arial,sans-serif;fill:#315477}
.brand{font:700 12px Arial,sans-serif;letter-spacing:.2px;fill:#8aa5c5}
</style></defs>
<rect width="1065" height="1136" fill="url(#paper)"/>
<circle cx="1002" cy="88" r="94" fill="#eaf3ff"/><circle cx="1002" cy="88" r="58" fill="#d8e9ff"/>
<text x="34" y="76" class="tag">ГИБРИДЫ · ПОТОК · ПРИОРИТИЗАЦИЯ</text><text x="34" y="143" class="title">Смешанные модели: Scrumban и Kanplan</text><text x="34" y="185" class="subtitle">Смешанные модели соединяют элементы Scrum и Kanban под характер работы команды.</text>
<rect x="32" y="212" width="1000" height="94" rx="22" fill="#fff" stroke="#c8ddf4" stroke-width="2"/>
<text x="54" y="237" class="eyebrow">КЛЮЧЕВАЯ СХЕМА</text><rect x="32" y="244" width="325.3333333333333" height="62" rx="16" fill="#e8f3ff" stroke="#9fc7f2" stroke-width="2"/><text x="194.66666666666666" y="277" text-anchor="middle" class="flow">Scrum</text><rect x="369.3333333333333" y="244" width="325.3333333333333" height="62" rx="16" fill="#f1edff" stroke="#c4b5fd" stroke-width="2"/><text x="532" y="277" text-anchor="middle" class="flow">Kanban</text><rect x="706.6666666666666" y="244" width="325.3333333333333" height="62" rx="16" fill="#e8faf3" stroke="#9cdec6" stroke-width="2"/><text x="869.3333333333333" y="277" text-anchor="middle" class="flow">Scrumban / Kanplan</text>

<rect x="32" y="330" width="491" height="184" rx="22" fill="#f2f8ff" stroke="#b9d7f5" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="368" r="19" fill="#315fae"/><text x="70" y="374" text-anchor="middle" class="number">1</text><text x="102" y="373" class="eyebrow">SCRUMBAN</text><text x="58" y="412" class="heading">Структура + гибкость</text><text x="58" y="440" class="body">Сочетает спринты, планирование, стендапы и ретроспективы</text><text x="58" y="461" class="body">Scrum с доской, непрерывным потоком и WIP-лимитами Kanban.</text><rect x="541" y="330" width="491" height="184" rx="22" fill="#f7f3ff" stroke="#d1c5f5" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="368" r="19" fill="#7863b6"/><text x="579" y="374" text-anchor="middle" class="number">2</text><text x="611" y="373" class="eyebrow">КОГДА ПОДХОДИТ</text><text x="567" y="412" class="heading">Нужны ритуалы и реакция на срочное</text><text x="567" y="440" class="body">Полезен при переходе к Kanban и в командах, где наряду с</text><text x="567" y="461" class="body">плановой работой появляются срочные дефекты.</text><rect x="32" y="532" width="491" height="184" rx="22" fill="#effbf6" stroke="#b8e4d0" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="570" r="19" fill="#23866a"/><text x="70" y="576" text-anchor="middle" class="number">3</text><text x="102" y="575" class="eyebrow">МЕТРИКИ</text><text x="58" y="614" class="heading">Фокус на потоке</text><text x="58" y="642" class="body">Вместо акцента только на Story Points могут использовать</text><text x="58" y="663" class="body">Cycle Time и Throughput.</text><rect x="541" y="532" width="491" height="184" rx="22" fill="#fff8e9" stroke="#f0d89e" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="570" r="19" fill="#c18b2e"/><text x="579" y="576" text-anchor="middle" class="number">4</text><text x="611" y="575" class="eyebrow">KANPLAN</text><text x="567" y="614" class="heading">Поток + упорядоченный backlog</text><text x="567" y="642" class="body">Kanban с приоритизированным бэклогом и отдельными сессиями</text><text x="567" y="663" class="body">сортировки задач.</text><rect x="32" y="734" width="491" height="184" rx="22" fill="#fff3f5" stroke="#edc4ce" stroke-width="2" filter="url(#shadow)"/><circle cx="70" cy="772" r="19" fill="#b65b75"/><text x="70" y="778" text-anchor="middle" class="number">5</text><text x="102" y="777" class="eyebrow">КОГДА ПОДХОДИТ</text><text x="58" y="816" class="heading">Нужен порядок без спринтов</text><text x="58" y="844" class="body">Подходит, когда важен непрерывный поток, но требуется</text><text x="58" y="865" class="body">регулярно уточнять приоритеты.</text><rect x="541" y="734" width="491" height="184" rx="22" fill="#effaff" stroke="#b8e4ee" stroke-width="2" filter="url(#shadow)"/><circle cx="579" cy="772" r="19" fill="#287e9a"/><text x="579" y="778" text-anchor="middle" class="number">6</text><text x="611" y="777" class="eyebrow">ПРАКТИКА QA</text><text x="567" y="816" class="heading">Плановое и срочное вместе</text><text x="567" y="844" class="body">WIP-лимиты помогают сочетать работу по плану и реакцию на</text><text x="567" y="865" class="body">срочные баги.</text>
<rect x="32" y="948" width="1000" height="132" rx="24" fill="#eaf5ff" stroke="#8dbce9" stroke-width="2"/>
<circle cx="80" cy="1018" r="25" fill="#2f65ad"/><path d="M68 1018l8 8 16-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="124" y="1001" class="footerTitle">ЗАПОМНИ</text><text x="124" y="1034" class="footer">Scrumban добавляет гибкость Kanban к ритму Scrum; Kanplan добавляет приоритизацию бэклога к потоку Kanban.</text>
<text x="34" y="1119" class="brand">QA Navigator</text>
</svg>
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <title>QA Navigator Web Application</title>
    <meta name="description" content="Comprehensive free QA tool offering test planning, execution, bug reporting, automation code generation, and an interactive QA theory handbook for testers." />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      .startup-shell {
        min-height: 100%; display: grid; place-items: center; box-sizing: border-box;
        background: #ffffff; color: #111827; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .startup-card { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border: 1px solid #e5e7eb; border-radius: 12px; }
      .startup-spinner { width: 18px; height: 18px; box-sizing: border-box; border: 2px solid #d1d5db; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
      .startup-title { margin: 0; font-size: 14px; font-weight: 600; }
      .startup-text { margin: 3px 0 0; font-size: 12px; color: #6b7280; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        .startup-shell { background: #0b0f14; color: #f3f4f6; }
        .startup-card { border-color: #27303a; background: #111820; }
        .startup-text { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-shell" role="status" aria-live="polite">
        <div class="startup-card">
          <div class="startup-spinner" aria-hidden="true"></div>
          <div>
            <p class="startup-title">QA Navigator</p>
            <p class="startup-text">Запуск приложения…</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
